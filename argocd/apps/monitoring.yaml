# kube-prometheus-stack: Prometheus Operator, Prometheus, Alertmanager, Grafana,
# kube-state-metrics and node-exporter. Values come from monitoring/values.yaml in this repo.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"   # CRDs first, so ServiceMonitors in the apps can sync
spec:
  project: platform
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 65.5.0
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/monitoring/values.yaml
    - repoURL: https://github.com/Captainpeace6/k8s-gitops-argocd.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true   # the operator's CRDs are too large for client-side apply
