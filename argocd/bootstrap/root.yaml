# App of apps: apply this once (kubectl apply -f argocd/bootstrap/root.yaml)
# and Argo CD manages everything under argocd/ from Git from then on.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Captainpeace6/k8s-gitops-argocd.git
    targetRevision: main
    path: argocd
    directory:
      recurse: true
      exclude: "bootstrap/*"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
